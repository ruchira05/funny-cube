; PlatformIO Project Configuration File
; Board: ESP32-S3 DevKitC-1 N16R8 (16 MB flash, 8 MB octal PSRAM)
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi   ; octal PSRAM (N16R8)

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1             ; Serial over the native USB port

lib_deps =
    olikraus/U8g2
    bblanchon/ArduinoJson

build_src_filter = +<*> -<tests/>

; Display test: only the OLED driver + src/tests/display_test.cpp.
;   pio run -e display_test -t upload -t monitor
[env:display_test]
extends = env:esp32s3
build_src_filter = +<display.cpp> +<tests/display_test.cpp>

; Mic test: INMP441 level meter, recording stats, WAV over USB.
;   pio run -e mic_test -t upload -t monitor
;   ~/.platformio/penv/bin/python tools/mic_capture.py   (save + play a recording)
[env:mic_test]
extends = env:esp32s3
build_src_filter = +<display.cpp> +<audio.cpp> +<tests/mic_test.cpp>

; Touch calibration: guided steps, prints TOUCH_* values for config.h.
;   pio run -e touch_cal -t upload -t monitor
[env:touch_cal]
extends = env:esp32s3
build_src_filter = +<display.cpp> +<audio.cpp> +<tests/touch_cal.cpp>
